<svg xmlns="http://www.w3.org/2000/svg" viewBox="140 140 720 720">
  <!-- Soi Repo: symbol only, transparent. For the video watermark and end card -->
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="200" y1="200" x2="820" y2="820">
      <stop offset="0" stop-color="#4ADE80"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)" fill="none" stroke="url(#g)">
    <circle cx="440" cy="440" r="245" stroke-width="62"/>
    <line x1="612" y1="612" x2="808" y2="808" stroke-width="74"/>
    <g stroke-width="30" stroke-linejoin="miter">
      <polyline points="362,392 302,440 362,488"/>
      <line x1="458" y1="378" x2="422" y2="502"/>
      <polyline points="518,392 578,440 518,488"/>
    </g>
  </g>
</svg>
