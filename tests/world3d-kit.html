<!doctype html>
<!--
  World3d model contact sheet.
  Run from a temporary project copy so HyperFrames sees a root composition:
    mkdir -p /tmp/world3d-kit/assets /tmp/world3d-kit/snapshots
    cp tests/world3d-kit.html /tmp/world3d-kit/index.html
    cp -a skills/scene-flow/assets/world3d skills/scene-flow/assets/vendor/three /tmp/world3d-kit/assets/
    cd /tmp/world3d-kit
    CHROME_PATH=/home/ngosi/.cache/ms-playwright/chromium_headless_shell-1254/chrome-headless-shell-linux64/chrome-headless-shell \
      node /home/ngosi/.agents/skills/hyperframes/scripts/plugin-cli.mjs snapshot --at 0 --no-end --timeout 170000 -o snapshots/world3d-kit
  The PNG is snapshots/world3d-kit/frame-00-at-0s.png.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>World3d kit contact sheet</title>
    <script type="importmap">
      {"imports":{"three":"./assets/vendor/three/three.module.js","three/addons/":"./assets/vendor/three/addons/"}}
    </script>
    <style>
      * { box-sizing: border-box; }
      html, body { width:1080px; height:1920px; margin:0; overflow:hidden; background:#0B0D12; color:#F4F7FA; font-family:Arial,sans-serif; }
      #root { position:relative; width:1080px; height:1920px; overflow:hidden; background:#0B0D12; }
      #models { position:absolute; z-index:2; inset:34px 0 0; display:grid; grid-template-columns:repeat(5, 1fr); grid-auto-rows:308px; gap:4px; padding:4px; }
      .piece { position:relative; min-width:0; border:1px solid #334155; border-radius:8px; overflow:hidden; }
      .piece-name { position:absolute; z-index:2; inset:auto 0 0; min-height:36px; padding:8px 5px; background:rgba(8,12,18,.94); color:#F4F7FA; font:700 13px/1.35 Arial,sans-serif; text-align:center; overflow-wrap:anywhere; }
      #render-layer { position:absolute; inset:0; z-index:1; pointer-events:none; }
      #render-layer canvas { display:block; width:1080px; height:1920px; }
      #status { position:absolute; z-index:3; top:8px; left:8px; padding:3px 7px; background:#0B0D12; color:#D9E3EC; font:11px Arial,sans-serif; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1080" data-height="1920" data-no-timeline="true">
      <div id="render-layer" aria-hidden="true"></div>
      <div id="models"></div>
      <div id="status">Loading kit</div>
    </div>
    <script>
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      let resolveKitReady;
      window.__hf.buildReady.world3dKit = new Promise(resolve => { resolveKitReady = resolve; });
    </script>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import * as SkeletonUtils from "three/addons/utils/SkeletonUtils.js";

      const WIDTH = 1080;
      const HEIGHT = 1920;
      const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false, preserveDrawingBuffer:true });
      renderer.setPixelRatio(1);
      renderer.setSize(WIDTH, HEIGHT, false);
      renderer.setClearColor(0x0B0D12, 1);
      renderer.setScissorTest(true);
      document.getElementById("render-layer").append(renderer.domElement);
      const loader = new GLTFLoader();
      const grid = document.getElementById("models");
      const status = document.getElementById("status");
      const cards = [];

      function addBox(parent, size, color, position = [0,0,0]) {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(...size), new THREE.MeshStandardMaterial({ color, roughness:0.58 }));
        mesh.position.set(...position);
        parent.add(mesh);
        return mesh;
      }

      function buildCode(piece) {
        const group = new THREE.Group();
        const [w,h,d] = piece.size;
        const c = piece.color;
        switch (piece.builder) {
          case "ground": case "rounded-box": case "token":
            addBox(group, piece.size, c);
            break;
          case "data-box":
            addBox(group, piece.size, c);
            addBox(group, [w*.58,h*.1,d*.08], "#ECFCCB", [0,h*.12,d*.53]);
            break;
          case "road":
            addBox(group, piece.size, c);
            for (let i=-3;i<=3;i++) addBox(group, [w*.026,.025,.075], "#CBD5E1", [i*w*.075,h*.53,0]);
            break;
          case "building":
            addBox(group, piece.size, c);
            for (let y=0;y<2;y++) for (let x=-1;x<=1;x++) addBox(group, [w*.12,h*.13,.05], "#BAE6FD", [x*w*.25,(y-.1)*h*.27,d*.51]);
            addBox(group, [w*.18,h*.36,.055], "#334155", [0,-h*.31,d*.52]);
            break;
          case "phone":
            addBox(group, piece.size, c);
            addBox(group, [w*.82,h*.78,.035], "#0F172A", [0,h*.015,d*.56]);
            addBox(group, [w*.22,.035,.025], "#94A3B8", [0,h*.39,d*.59]);
            break;
          case "server":
            addBox(group, piece.size, c);
            for (let row=0;row<4;row++) addBox(group, [w*.78,h*.13,.055], "#1E293B", [0,(1.5-row)*h*.19,d*.53]);
            break;
          case "factory":
            addBox(group, [w*.92,h*.72,d*.9], c, [0,-h*.12,0]);
            addBox(group, [w*.58,h*.25,d*.92], "#FDBA74", [w*.17,h*.37,0]);
            for (let i=0;i<2;i++) addBox(group, [w*.12,h*.52,w*.12], "#64748B", [(i-.5)*w*.48,h*.5,-d*.2]);
            break;
          case "robot": {
            const head = new THREE.Mesh(new THREE.SphereGeometry(w*.28, 12, 8), new THREE.MeshStandardMaterial({color:"#E2E8F0"}));
            head.position.y=h*.78; group.add(head);
            addBox(group, [w*.55,h*.45,d*.4], c, [0,h*.37,0]);
            addBox(group, [w*.18,h*.36,w*.18], "#CBD5E1", [-w*.35,h*.39,0]);
            addBox(group, [w*.18,h*.36,w*.18], "#CBD5E1", [w*.35,h*.39,0]);
            addBox(group, [w*.17,h*.18,d*.24], "#334155", [0,h*.04,0]);
            break;
          }
          default: throw new Error("unknown code builder " + piece.builder);
        }
        return group;
      }

      function normalizedModel(piece, gltf) {
        const model = SkeletonUtils.clone(gltf.scene);
        model.position.set(...piece.offset);
        const root = new THREE.Group();
        root.rotation.set(...piece.rot.map(THREE.MathUtils.degToRad));
        root.scale.setScalar(piece.scale);
        root.add(model);
        root.updateMatrixWorld(true);
        const bounds = new THREE.Box3().setFromObject(root);
        piece.size = bounds.getSize(new THREE.Vector3()).toArray();
        return { root, bounds };
      }

      function frameFor(piece, scene, bounds, rect) {
        scene.add(new THREE.HemisphereLight(0xEAF6FF, 0x27313A, 2.2));
        const key = new THREE.DirectionalLight(0xFFF3D6, 2.7);
        key.position.set(4, 7, 8);
        scene.add(key);
        const size = bounds.getSize(new THREE.Vector3());
        const center = bounds.getCenter(new THREE.Vector3());
        const longest = Math.max(size.x, size.y, size.z, 0.1);
        const viewHeight = Math.max(1, rect.height - 36);
        const camera = new THREE.PerspectiveCamera(34, rect.width / viewHeight, 0.01, 200);
        const distance = longest * 2.45;
        camera.position.set(center.x + distance*.38, center.y + distance*.18, center.z + distance*.92);
        camera.lookAt(center);
        return { camera, center, size };
      }

      function draw() {
        renderer.clear(true, true, true);
        for (const card of cards) {
          const { left, top, width, height } = card.rect;
          const viewHeight = height - 36;
          const bottom = HEIGHT - top - height;
          renderer.setViewport(Math.round(left), Math.round(bottom + 36), Math.round(width), Math.round(viewHeight));
          renderer.setScissor(Math.round(left), Math.round(bottom + 36), Math.round(width), Math.round(viewHeight));
          renderer.setClearColor(0x111A24, 1);
          renderer.clear(true, true, true);
          renderer.render(card.scene, card.camera);
        }
      }

      (async () => {
        const KIT = await (await fetch("./assets/world3d/kit.json")).json();
        const glbData = new Map();
        await Promise.all(KIT.filter(piece => piece.type === "glb").map(async piece => {
          try {
            glbData.set(piece.name, await loader.loadAsync("./assets/world3d/models/" + piece.file));
          } catch (error) {
            console.error("world3d kit: failed to load " + piece.file, error);
            throw error;
          }
        }));
        for (const piece of KIT) {
          const card = document.createElement("div");
          card.className = "piece";
          const label = document.createElement("div");
          label.className = "piece-name";
          label.textContent = piece.name;
          card.append(label);
          grid.append(card);
          const rect = card.getBoundingClientRect();
          const scene = new THREE.Scene();
          scene.background = new THREE.Color(0x111A24);
          let model;
          if (piece.type === "glb") model = normalizedModel(piece, glbData.get(piece.name)).root;
          else model = buildCode(piece);
          scene.add(model);
          model.updateMatrixWorld(true);
          const bounds = new THREE.Box3().setFromObject(model);
          const { camera, center, size } = frameFor(piece, scene, bounds, rect);
          cards.push({ piece, scene, camera, rect: { left:rect.left, top:rect.top, width:rect.width, height:rect.height } });
          if (piece.type === "glb") {
            piece.size = size.toArray();
            const bottom = center.y - size.y * 0.5;
            if (Math.abs(bottom) > 0.02) console.warn("world3d kit pivot:", piece.name, "bottom y", bottom.toFixed(4));
          }
        }
        await Promise.all(cards.map(card => renderer.compileAsync(card.scene, card.camera)));
        draw();
        status.textContent = KIT.length + " kit pieces · all models upright, Y-up, floor-pivoted";
        resolveKitReady();
      })().catch(error => console.error("world3d kit contact sheet setup failed", error));

      window.__world3dKit = { get pieces() { return cards.map(card => ({ name:card.piece.name, size:card.piece.size || null })); }, draw };
    </script>
  </body>
</html>
